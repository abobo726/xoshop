<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XO 雜貨舖封面更新工具</title><style>body{font:16px system-ui,'Microsoft JhengHei',sans-serif;max-width:680px;margin:40px auto;padding:18px;background:#f3f7fd;color:#152337}section{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 20px #0001}button{border:0;border-radius:8px;padding:12px 20px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}input{margin:12px 0}p{line-height:1.8}#status{white-space:pre-wrap;color:#245}</style></head><body><section><h2>📦 XO 雜貨舖・開團封面更新工具</h2><p>按下按鈕，會從你的 GitHub 讀取 <code>xoshop/index.html</code>，製作新版下載。也可以選擇你電腦上的原版 index.html。工具不會自行修改 GitHub 或訂單資料。</p><label>或手動選擇原本的 index.html：<input type="file" id="source" accept=".html,text/html"></label><p><button id="go">製作有開團封面的新版 index.html</button></p><div id="status" role="status"></div></section><script>
const status=document.getElementById('status');
function transform(src){
 let c=src;
 function swap(a,b){if(!c.includes(a))throw Error('網站版本與此工具不符合，找不到：'+a.slice(0,50));c=c.replace(a,b)}
 if(c.includes('group-photo-preview')&&c.includes('uploadGroupPhoto'))throw Error('這份程式已經有封面上傳功能，請不要重複修改');
 swap('@media(max-width:700px)',`.group-heading{display:flex;align-items:flex-start;gap:13px}.group-photo{width:84px;height:84px;flex:0 0 84px;object-fit:cover;border-radius:10px;border:1px solid #36516f;background:#14243a}.group-heading-body{min-width:0;flex:1}.group-heading-body .group-top{align-items:flex-start}.group-photo-preview{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid #36516f;margin-top:8px}.group-upload-note{font-size:12px;color:var(--muted)}@media(max-width:700px)`);
 swap('<div class="field"><label>排序（數字越小越前面）</label><input id="groupSort" type="number" value="0"></div></div><div class="actions"><button class="btn" id="saveGroup">',`<div class="field"><label>排序（數字越小越前面）</label><input id="groupSort" type="number" value="0"></div><div class="field"><label>團購封面（正方形，選填）</label><input id="groupPhoto" type="file" accept="image/jpeg,image/png,image/webp"><div class="group-upload-note">選一張照片即可，會自動壓縮成正方形。未選就保留原封面。</div><img id="groupPhotoPreview" class="group-photo-preview hidden" alt="團購封面預覽"><label style="margin-top:8px"><input type="checkbox" id="groupRemovePhoto" style="width:auto"> 移除目前封面</label></div></div><div class="actions"><button class="btn" id="saveGroup">`);
 swap('`<article class="group-card"><div class="group-top"><h3>${esc(x.group_name)}</h3><span class="status">${esc(x.status||"進行中")}</span></div><p class="group-note">','`<article class="group-card"><div class="group-heading">${x.image_url?`<img class="group-photo" loading="lazy" src="${esc(safeUrl(x.image_url))}" alt="${esc(x.group_name)} 團購封面">`:""}<div class="group-heading-body"><div class="group-top"><h3>${esc(x.group_name)}</h3><span class="status">${esc(x.status||"進行中")}</span></div><p class="group-note">');
 swap('${esc(x.progress_note||"進度更新中")}</p><div class="progress-meta">','${esc(x.progress_note||"進度更新中")}</p></div></div><div class="progress-meta">');
 swap('function clearGroupForm(){["groupId","groupName","groupStatus","groupNote","groupUrl"].forEach(id=>$(id).value="");$("groupPercent").value="0";$("groupSort").value="0"}',`function clearGroupForm(){["groupId","groupName","groupStatus","groupNote","groupUrl","groupPhoto"].forEach(id=>$(id).value="");$("groupPercent").value="0";$("groupSort").value="0";$("groupRemovePhoto").checked=false;showGroupPhoto("")}
function showGroupPhoto(url){const img=$("groupPhotoPreview");img.classList.toggle("hidden",!url);if(url)img.src=url;else img.removeAttribute("src")}
$("groupPhoto").addEventListener("change",()=>{const file=$("groupPhoto").files[0];if(file){showGroupPhoto(URL.createObjectURL(file));$("groupRemovePhoto").checked=false}else showGroupPhoto(groups.find(x=>String(x.id)===String($("groupId").value))?.image_url||"")});
$("groupRemovePhoto").addEventListener("change",()=>{if($("groupRemovePhoto").checked){$("groupPhoto").value="";showGroupPhoto("")}else showGroupPhoto(groups.find(x=>String(x.id)===String($("groupId").value))?.image_url||"")});
async function compressGroupPhoto(file){if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw Error("請選 JPG、PNG 或 WebP 圖片");if(file.size>15*1024*1024)throw Error("圖片不可超過 15 MB");const bmp=await createImageBitmap(file),canvas=document.createElement("canvas");canvas.width=canvas.height=600;const ctx=canvas.getContext("2d");const side=Math.min(bmp.width,bmp.height),sx=(bmp.width-side)/2,sy=(bmp.height-side)/2;ctx.drawImage(bmp,sx,sy,side,side,0,0,600,600);bmp.close?.();return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error("照片壓縮失敗")),"image/jpeg",.82))}
async function uploadGroupPhoto(file){const blob=await compressGroupPhoto(file),path="groups/"+crypto.randomUUID()+".jpg";const {error}=await db.storage.from("group-covers").upload(path,blob,{contentType:"image/jpeg",upsert:false});if(error)throw error;return {path,url:db.storage.from("group-covers").getPublicUrl(path).data.publicUrl}}
async function deleteGroupPhoto(url){const marker="/storage/v1/object/public/group-covers/";if(!url?.includes(marker))return;const path=url.split(marker)[1];if(path?.startsWith("groups/"))await db.storage.from("group-covers").remove([decodeURIComponent(path)])}`);
 const start=c.indexOf('$("saveGroup").onclick=async()=>');
 const end=c.indexOf('\nwindow.editGroup=',start);
 if(start<0||end<0)throw Error('找不到團購儲存程式');
 c=c.slice(0,start)+`$("saveGroup").onclick=async()=>{
 const btn=$("saveGroup"),id=$("groupId").value,name=$("groupName").value.trim();
 if(!isAdmin)return;if(!name){message("adminMessage","請填寫團購名稱。",true);return}
 const old=groups.find(x=>String(x.id)===String(id));
 const file=$("groupPhoto").files[0],remove=$("groupRemovePhoto").checked;
 btn.disabled=true;message("adminMessage",file?"正在上傳封面照片…":"正在儲存開團…");
 let newUpload=null;
 try{
   let image_url=old?.image_url||null;
   if(remove)image_url=null;
   if(file){newUpload=await uploadGroupPhoto(file);image_url=newUpload.url}
   const payload={group_name:name,status:$("groupStatus").value.trim(),progress_note:$("groupNote").value.trim(),progress_percent:Math.max(0,Math.min(100,Number($("groupPercent").value)||0)),link_url:$("groupUrl").value.trim(),sort_order:Number($("groupSort").value)||0,image_url,updated_at:new Date().toISOString()};
   const q=id?await db.from("group_updates").update(payload).eq("id",id):await db.from("group_updates").insert({...payload,is_visible:true});
   if(q.error)throw q.error;
   if(old?.image_url&&old.image_url!==image_url)await deleteGroupPhoto(old.image_url).catch(console.warn);
   clearGroupForm();message("adminMessage","開團資料與封面已儲存。");await loadData();
 }catch(e){if(newUpload)await db.storage.from("group-covers").remove([newUpload.path]).catch(()=>{});message("adminMessage","開團儲存失敗："+(e.message||e),true)}
 finally{btn.disabled=false}
};`+c.slice(end);
 swap('$("groupSort").value=x.sort_order||0;document.querySelector("#groupName")','$("groupSort").value=x.sort_order||0;$("groupPhoto").value="";$("groupRemovePhoto").checked=false;showGroupPhoto(x.image_url||"");document.querySelector("#groupName")');
 return c;
}
document.getElementById('go').onclick=async()=>{const btn=document.getElementById('go');btn.disabled=true;status.textContent='正在製作…';try{let src,files=document.getElementById('source').files;if(files.length)src=await files[0].text();else{const r=await fetch('https://raw.githubusercontent.com/abobo726/xoshop/main/index.html?cache='+Date.now());if(!r.ok)throw Error('無法取得 GitHub 原始碼，請改用手動選取 index.html');src=await r.text()}const output=transform(src);const blob=new Blob([output],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);status.textContent='✅ 已產生新版 index.html！請先備份 GitHub 原本的檔案，再上傳到 xoshop 專案（不是 aboorder）。';}catch(e){status.textContent='⚠️ '+e.message}finally{btn.disabled=false}};
</script></body></html>
